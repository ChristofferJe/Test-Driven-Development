plugins {
    // Tell Gradle that this is a java project
    id 'java'
    // and to use JaCoCo for code coverage computation
    id 'jacoco'
}

// The deck building library is not an official library, so I have put it
// in a SNAPSHOT repository that needs the full URL to pull.
repositories {
    maven {
        url "https://s01.oss.sonatype.org/content/repositories/snapshots/"
    }
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter API for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    // Use JUnit Jupiter Engine for testing.
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'

    // Use the Hamcrest matcher library
    testImplementation group: 'org.hamcrest',
            name: 'hamcrest-library', version: '2.2'

    implementation 'com.baerbak.maven:hotstone-deck:1.0-SNAPSHOT'
}


test {
    // Use junit platform for unit tests
    useJUnitPlatform()
}

// Use gradle v 8
wrapper {
  gradleVersion = '8.1.1'
}

// Use latest Jacoco test coverage tool
jacoco {
  toolVersion = "0.8.10"
}
